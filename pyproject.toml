[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ichava-maintainer-toolkit"
version = "0.1.0"
description = "Maintainer toolkit for the Ichava Laravel icon-pack ecosystem -- downloads, transforms, and commits SVG asset refreshes."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Imani Manyara", email = "imani@simtabi.com" }]
keywords = ["ichava", "icons", "svg", "maintainer", "tooling", "laravel"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]

dependencies = [
    "typer>=0.12.0",
    "questionary>=2.0.0",
    "rich>=13.7.0",
    "requests>=2.32.0",
    "tenacity>=9.0.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "responses>=0.25.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]

[project.scripts]
# Long form for clarity in scripts + docs.
ichava-maintainer-toolkit = "ichava_maintainer_toolkit.cli:app"
# Short alias for interactive shell use.
imt = "ichava_maintainer_toolkit.cli:app"

[project.urls]
Homepage = "https://github.com/ichava/maintainer-toolkit"
Documentation = "https://github.com/ichava/documentation"
Repository = "https://github.com/ichava/maintainer-toolkit"
Issues = "https://github.com/ichava/maintainer-toolkit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ichava_maintainer_toolkit"]

[tool.hatch.build.targets.wheel.shared-data]
"config" = "share/ichava-maintainer-toolkit/config"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
