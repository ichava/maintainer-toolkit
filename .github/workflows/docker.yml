# Build + publish the maintainer-toolkit Docker image to ghcr.io.
#
# Triggers:
#   * push to main         -> `:latest` + `:main-<sha>` tags
#   * tag v*               -> `:<version>` + `:latest` tags
#   * workflow_dispatch    -> ad-hoc rebuild
#
# Consumed by each pack's `.github/workflows/sync-upstream.yml`,
# which runs `docker run ghcr.io/ichava/maintainer-toolkit:latest`.

name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=main-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build + push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Smoke-test the image
        # Sanity check: the published image's CLI responds. Catches
        # entrypoint regressions before downstream pack workflows pull it.
        run: |
          docker run --rm ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }} version
