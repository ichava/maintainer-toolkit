# Tests + lint + typecheck for ichava/maintainer-toolkit.
#
# Runs on every pull request, and on demand via workflow_dispatch. The
# matrix covers the Python versions the project declares it supports
# (>=3.10 in pyproject.toml).

name: Tests

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src tests

      - name: Format check with ruff
        run: ruff format --check src tests

      - name: Type-check with mypy
        # mypy strict catches most refactor regressions cheaply.
        # We allow it to fail today (the codebase isn't 100% typed yet);
        # remove `|| true` once mypy-strict is green.
        run: mypy src || true

      - name: Run pytest
        run: pytest -q --cov=ichava_maintainer_toolkit --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          flags: unittests
          fail_ci_if_error: false

  actionlint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Nothing else reads these files until a tag is pushed. `release.yml` triggers
    # on `push: tags`, so until now a broken workflow was first observed as a
    # release that refused to start -- after the decision to release had been made.
    #
    # A YAML parse is not a substitute. `yaml.safe_load` accepts a duplicate key
    # and silently keeps the last one, which is how a double-applied patch shipped
    # a step carrying `continue-on-error:` twice and still validated clean.
    # actionlint rejects what Actions rejects.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: Changelog order

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # A misordered CHANGELOG still releases correctly, because release.yml
      # finds a section by heading rather than by position -- so nothing else
      # in this ecosystem catches it. Two packs had it: browser carried
      # [Unreleased] below [0.2.7], and icon-sets-emoji had [0.2.6] filed
      # between [0.1.1] and [0.1.0]. Closing [Unreleased] in place would have
      # filed the new version underneath an older one.
      - name: Check CHANGELOG section order
        run: |
          python3 - CHANGELOG.md <<'PYEOF'
          import re, sys

          path = sys.argv[1]
          try:
              text = open(path, encoding='utf-8').read()
          except FileNotFoundError:
              print(f'::error::{path} not found'); sys.exit(1)

          heads = re.findall(r'^## \[([^\]]+)\]', text, re.M)
          if not heads:
              print(f'::error::{path} has no "## [version]" headings'); sys.exit(1)

          def order_key(v):
              nums = [int(n) for n in re.findall(r'\d+', v)[:3]]
              return tuple(nums + [0] * (3 - len(nums)))

          problems = []
          if 'Unreleased' in heads and heads[0] != 'Unreleased':
              problems.append(
                  f'[Unreleased] is section {heads.index("Unreleased") + 1}, not the first. '
                  'Closing it in place would file the new version below an older one.')

          versions = [h for h in heads if h != 'Unreleased']
          for older, newer in zip(versions, versions[1:]):
              if order_key(older) < order_key(newer):
                  problems.append(f'[{older}] is listed above [{newer}], but is the lower version.')

          if problems:
              print(f'::error::{path} sections are out of order:')
              for p in problems:
                  print(f'::error::  {p}')
              sys.exit(1)

          print(f'{path}: {len(heads)} sections, correctly ordered')
          PYEOF
