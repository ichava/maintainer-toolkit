# Tests + lint + typecheck for ichava/maintainer-toolkit.
#
# Runs on every pull request, and on demand via workflow_dispatch. The
# matrix covers the Python versions the project declares it supports
# (>=3.10 in pyproject.toml).

name: Tests

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src tests

      - name: Format check with ruff
        run: ruff format --check src tests

      - name: Type-check with mypy
        # mypy strict catches most refactor regressions cheaply.
        # We allow it to fail today (the codebase isn't 100% typed yet);
        # remove `|| true` once mypy-strict is green.
        run: mypy src || true

      - name: Run pytest
        run: pytest -q --cov=ichava_maintainer_toolkit --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: unittests
          fail_ci_if_error: false
